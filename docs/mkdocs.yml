site_name: Manning/Patrol Compliance System
site_description: Documentation for the Metro manning and patrol compliance system
site_author: Team 8
repo_url: https://github.com/aau-cph-sw5/case-b-manning-patrol
repo_name: aau-cph-sw5/case-b-manning-patrol
edit_uri: edit/main/docs/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Development:
    - Setup: development/setup.md
    - Backend (API): development/backend.md
    - Web Dashboard: development/web.md
    - Android App: development/android.md
    - Contracts: development/contracts.md
  - Architecture Decision Records:
    - Overview: adr/index.md
    - "ADR-0001: Record architectural decisions": adr/0001-record-architectural-decision.md
    - "ADR-0002: Evidence rule decision": adr/0002-evidence-rule-decision.md
    - "ADR-0003: Branching strategy": adr/0003-branching-strategy.md
    - "ADR-0004: Positioning interface contract": adr/0004-positioning-interface-contract.md
    - "ADR-0005: Hosting platform": adr/0005-hosting-platform.md
    - "ADR-0006: Tolerated gap decision": adr/0006-tolerated-gap-decision.md
    - "ADR-0007: Database decision": adr/0007-database-decision.md
    - "ADR-0008: Append-only event store": adr/0008-append-only-event-store-decision.md
    - "ADR-0009: Late-arriving report rule": adr/0009-late-arriving-report-rule.md
    - "ADR-0010: Patrol completion": adr/0010-patrol-completion.md
    - "ADR-0011: Server-sent events": adr/00011-server-sent-events.md

copyright: MIT License
