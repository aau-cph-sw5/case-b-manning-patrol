[project]
name = "manning-patrol-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Signe", email = "snj2740@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6.1",
    "sqlmodel>=0.0.47",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
dev = "src.main:dev"
positioning-simulator = "src.api.v1.routers.positioning_simulator:app"
lint = "src.scripts.lint:main"
check = "src.scripts.check:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "pytest-asyncio>=1.4.0",
]