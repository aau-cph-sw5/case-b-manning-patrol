# Workflow for auditing all project dependencies for vulnerabilities.
#
# Covers both package ecosystems in this repo:
#   - npm  (apps/android, apps/web)
#   - uv   (services/api)
#
# Runs on every push and pull request, plus a weekly schedule so that newly
# disclosed advisories are caught even when no code has changed.

name: Dependency Audit

on:
  push:
    branches: ["release-*", "main"]
  pull_request:
    branches: ["release-*", "main"]
  schedule:
    - cron: '0 6 * * 1' # Every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit (${{ matrix.workdir }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        workdir: [apps/android, apps/web]

    defaults:
      run:
        working-directory: ${{ matrix.workdir }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: ${{ matrix.workdir }}/package-lock.json

        # Fail on high/critical advisories, with documented exceptions for the
    # Expo SDK 57 build chain (see apps/android/.audit-ci.json):
    #   GHSA-vfj7-8cjw-p6xm (braces, high)      - no patched release exists on npm (latest 3.0.3 is vulnerable)
    #   GHSA-86w9-cpqp-85rv (node-forge, high)  - no patched release exists on npm (latest 1.4.0 is vulnerable)
    # Both are dev/build tooling (metro file matching, code-signing certs),
    # not code shipped to devices. `npm audit fix --force` would downgrade to
    # Expo SDK 44 and break the app. audit-ci prints "Consider not
    # allowlisting" once an advisory disappears from the report - remove it
    # from the allowlist when that happens (e.g. braces > 3.0.3 ships).
    - name: Audit dependencies
      run: npx --yes audit-ci@^7 --config .audit-ci.json
      
      # Previous command:
      # run: npm audit --audit-level=high

  uv:
    name: uv audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Setup Python
      run: uv python install

    - name: Export locked dependencies
      run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.txt

    - name: Audit dependencies
      run: uvx pip-audit -r requirements.txt