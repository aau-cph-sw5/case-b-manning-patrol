# Workflow for auditing all project dependencies for vulnerabilities.
#
# Covers both package ecosystems in this repo:
#   - npm  (apps/android, apps/web)
#   - uv   (services/api)
#
# Runs on every push and pull request, plus a weekly schedule so that newly
# disclosed advisories are caught even when no code has changed.

name: Dependency Audit

on:
  push:
    branches: ["release-*", "main"]
  pull_request:
    branches: ["release-*", "main"]
  schedule:
    - cron: '0 6 * * 1' # Every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit (${{ matrix.workdir }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # the android app is an Expo project: most advisories live in the build
          # toolchain (@expo/cli, metro, config plugins), which runs on the dev machine
          # and never ships to the device. gate on critical only and let Expo SDK
          # patch releases clear the toolchain advisories; re-raise to high when the
          # SDK catches up (check with: npx expo install --check && npm audit).
          - workdir: apps/android
            audit-level: critical
          # the desktop app is a plain Vite bundle where high advisories are reachable
          # from the browser, so it keeps the strict gate.
          - workdir: apps/web
            audit-level: high

    defaults:
      run:
        working-directory: ${{ matrix.workdir }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: ${{ matrix.workdir }}/package-lock.json

    - name: Audit dependencies
      run: npm audit --audit-level=${{ matrix.audit-level }}

  uv:
    name: uv audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Setup Python
      run: uv python install

    - name: Export locked dependencies
      run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.txt

    - name: Audit dependencies
      run: uvx pip-audit -r requirements.txt
