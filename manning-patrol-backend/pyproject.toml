[project]
name = "manning-patrol-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Signe", email = "snj2740@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
]

[project.scripts]
dev = "manning_patrol_backend.dev_server:main"
positioning-simulator = "manning_patrol_backend.positioning_simulator:app"
lint = "manning_patrol_backend.lint:main"
check = "manning_patrol_backend.check:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.10.0",
    "ty",
]
